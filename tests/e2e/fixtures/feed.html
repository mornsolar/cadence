<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixture feed</title>
  <style>
    html, body { margin: 0; background: #111; color: #eee; font-family: sans-serif; }
    .card { height: 100vh; display: grid; place-items: center; font-size: 3rem; }
    video { width: 1px; height: 1px; opacity: 0; }
  </style>
</head>
<body>
  <main id="feed"></main>
  <script>
    // Mimics a desktop short-form feed: one full-viewport card at a time, a wheel tick
    // moves to the next card, and the URL updates to the card's permalink. On a
    // non-feed path (a profile page) the URL never changes, like a profile grid.
    const CARDS = 40;
    const host = location.hostname;
    const path = location.pathname;
    const permalink = (i) => {
      if (host.includes('tiktok')) return `/@fixture/video/7000000000${String(i).padStart(9, '0')}`;
      if (host.includes('instagram')) return `/reels/FIX${String(i).padStart(4, '0')}/`;
      if (host.includes('facebook')) return `/reel/${9000000000000000 + i}`;
      return `/shorts/fix${String(i).padStart(7, '0')}`;
    };
    const isProfile = /^\/@[^/]+\/?$/.test(path) && host.includes('tiktok');

    const feed = document.getElementById('feed');
    for (let i = 0; i < CARDS; i += 1) {
      const card = document.createElement('section');
      card.className = 'card';
      card.dataset.index = String(i);
      card.innerHTML = `<span>card ${i}</span><video muted playsinline></video>`;
      feed.appendChild(card);
    }

    let index = 0;
    function goTo(next) {
      index = Math.max(0, Math.min(CARDS - 1, next));
      window.scrollTo({ top: index * window.innerHeight, behavior: 'instant' });
      if (!isProfile) history.pushState({}, '', permalink(index));
      document.title = `card ${index}`;
    }
    window.addEventListener('wheel', (event) => {
      event.preventDefault();
      if (event.deltaY > 0) goTo(index + 1);
      else if (event.deltaY < 0) goTo(index - 1);
    }, { passive: false });
    window.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowDown') goTo(index + 1);
      if (event.key === 'ArrowUp') goTo(index - 1);
    });
    if (!isProfile) history.replaceState({}, '', permalink(0));

    // Reproduces the real bug this fixture exists to catch: TikTok and YouTube
    // Shorts don't auto-advance when a clip finishes, they loop it in place, and
    // some players do that by swapping in a fresh <video> element rather than
    // rewinding the existing one. No URL change, no user input — just a new node
    // at the same spot. A test can call this with no preceding gesture to prove
    // that alone must never be counted as a swipe.
    window.__cadenceFixture = {
      loopCurrentVideo() {
        const card = document.querySelector(`.card[data-index="${index}"]`);
        const old = card?.querySelector('video');
        if (!old) return;
        const next = document.createElement('video');
        next.muted = true;
        next.playsInline = true;
        old.replaceWith(next);
      },
      // Marks the current card's video as having played through, the way a real
      // clip would just before it loops. A swipe right after this should not be
      // counted as a skip — only swiping away before this point should be.
      finishCurrentVideo() {
        const card = document.querySelector(`.card[data-index="${index}"]`);
        card?.querySelector('video')?.dispatchEvent(new Event('ended'));
      },
    };
  </script>
</body>
</html>
